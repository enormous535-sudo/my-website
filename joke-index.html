<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="joke-styles.css">
</head>
<body>
    <div class="container">
        <div class="joke-box">
            <h1>😄 Joke Generator</h1>
            
            <div class="joke-display" id="jokeDisplay">
                <p class="joke-text">Click the button to get a random joke!</p>
            </div>

            <div class="button-group">
                <button id="getJokeBtn" class="get-joke-btn">Get Joke</button>
                <button id="copyBtn" class="copy-btn">Copy</button>
            </div>

            <div class="category-section">
                <label for="categorySelect">Choose Category:</label>
                <select id="categorySelect">
                    <option value="general">General</option>
                    <option value="programming">Programming</option>
                    <option value="knock-knock">Knock-Knock</option>
                </select>
            </div>

            <div class="joke-counter">
                <p>Jokes Loaded: <span id="jokeCount">0</span></p>
            </div>

            <div class="loading" id="loading">
                <p>Loading joke...</p>
            </div>

            <div class="error" id="errorMsg"></div>
        </div>
    </div>

    <script src="joke-script.js"></script>
</body>
</html>
